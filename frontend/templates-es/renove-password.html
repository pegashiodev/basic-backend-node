<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>PAGINA PARA HACER UN CAMBIO DE CONTRASEÑA POR OLVIDO -> ESPAÑOL!!</h1>


    <h2>Leemos la URL y extraemos el token para adjuntarlo en el form</h2>

    <form action="">
        <p><input type="text" placeholder="password"></p>
        <p><input type="text" placeholder="repetir-password"></p>

        <button id="send_form">enviar</button>
    </form>


    <script>

        // LO SACAMOS DE LA URL DE ESTA PAGINA midominio.com/renove-password.html/?tk=url_token
        const url_token = "12345A"
        let data_form_simple = {
            tk: url_token,
            password: "67890",
            "fa2": false,
        }

        let send_fa2 = {
            "fa2": {
                status: "SEND",
                mode_notify: "EMAIL", //"SMS"
                url_token: url_token,
            }

        }


        let data_form_complet = {
            "tk": url_token,
            "password": "12345",
           
            "fa2": {
                status: "RECIBED",
                mode_notify: "EMAIL", //"SMS"
                code: "Code-recibed",
                url_token: url_token,
            }
        }

        const btn = document.querySelector("#send_form")

        btn.addEventListener('click', function(e){
            e.preventDefault();
            

            // fetch(`http://localhost:3000/renove-password.html/?tk=${url_token}`, 
            fetch(`http://localhost:3000/renove-password.html`, 

            
            {
                method: 'POST',
                headers: {  "Content-Type": "application/json",
                            "Cookie": document.cookie
                        },
                body:  JSON.stringify(data_form_simple)
            
            })
            .then(response=>{

                if(response.ok){
                    return response.json()
                }else{
                    throw new Error("Error en el cambio de PASSWORD -> MAs tarde!!");
                }   

            }).then(result=>{
                console.log(result);
                const host = document.location.host;
                const pathname = document.location.pathname;
                if(result.status === 'ok'){
                    console.log(' ')
                    alert("CAMBIO DE PASSWORD REALIZADO")
                    if(result.location){
                        document.location.href =  result.location
                    }
                }else{
                    console.log('ERROR en la respuesta del CAMBIO ')
                    console.log(result.code)
                    alert(result.message)
                    if(result.location){
                        document.location.href =  result.location
                    }
                }
            }).catch(err=>{
                console.log(err)
                // Redirigir a HOME
                alert("Error en el Fetch")

            })



        })

    </script>
    
</body>
</html>
