
<!DOCTYPE html>

<body>

    <H1>acceso-plataforma.html --- > ESPAÑOL</H1>

    <div class="wrap">
        <div class="form signup_form">
            <div class="top_data">
                <p><input class="username" type="text" placeholder="username"></p>
                <p><input class="email" type="text" placeholder="email"></p>
                <p><input class="password" type="text" placeholder="password"></p>

                <button id="btn_signup">ENVIAR CODIGO</button>
            </div>

            <div id="googleBtnContainer"></div>

            <div id="promoCodeWrap">

            </div>
            <div class="fa2">
                <p><input id="signup_validation_token" type="text" placeholder="CODIGO"></p>
                <button id="btn_verify_signup">CREAR CUENTA</button>
            </div>
        </div>
    
        <div class="form login_form">
            <div class="top_data">
                <p><input class="username" type="text" placeholder="username"></p>
                <p><input class="email" type="text" placeholder="Email"></p>
                <p><input class="password" type="text" placeholder="Password"></p>
                <button id="btn_login">LOGIN</button>
            </div>
            <div class="fa2">
                <p><input id="login_validation_token" type="text" placeholder="CODIGO"></p>
                <button id="btn_verify_login">VERIFICAR</button>
            </div>
            <div id="forgot-password-wrap">
                <p>¿Olvidó su contraseña?</p>
                <div id="forgot-password-content">
                    <p><input class="password" type="email" placeholder="Introduzca su Email"></p>
                    <button id="btn_forgot_password">Renovar Contraseña</button>
                </div>
            </div>
        </div>
    
        <div class="form logout_form">
            <button id="btn_logout">LOGOUT</button>
        </div>
    </div>
    

    <script>
        const btn_signup = document.querySelector('#btn_signup');
        const btn_login = document.querySelector('#btn_login');
        const btn_logout = document.querySelector('#btn_logout');
        const btn_forgot_password = document.querySelector('#btn_forgot_password')
        const btn_verify_signup = document.querySelector("#btn_verify_signup")
        const btn_verify_login = document.querySelector("#btn_verify_login")

        const data_signup = {
            type: "SIGNUP",
            name: '',
            email: "",
            signup_method: "USER-EMAIL",
            password: "",
            promoCode: undefined,
            authProvider: "EMAIL"         
           
        }

        const data_login = {
            name: '',
            email: "",
            signup_method: "USER-EMAIL",
            password: '',
           
        }
        data_forgot_password = {
            email: "",
        }

        btn_signup.addEventListener('click', async (ev)=>{
            ev.preventDefault();
            data_signup.name = document.querySelector('.signup_form .username').value;
            data_signup.email = document.querySelector(".signup_form .email").value;
            data_signup.password = document.querySelector(".signup_form .password").value;

            if(data_signup.name.length <2){
                alert("Al menos 2 Caracteres en el Nombre")
                return;
            }

            // Añadimos el Endpoint que le llevo al signup para luego devolverle a el
            // Habiamos colocado "@@&" en el endpoint desde donde llegabamos y AHora lo sustituimos por "?" para hacer el serach si lo hubiese
            // Si viene del carrito, por ejemplo, es posible que haya parametros en la url con info del carrito
            // Si viene de un "restrictedEndpoint", seguramente no habra search
            // ...
            if(location.search.split("?from=")[1]){

                data_signup.previous_endpoint = location.search.split("?from=")[1].replace("@@&", "?");
            }
            const url_signup = "http://localhost:3000/signup-email"
           
            const result = await fetchRequest(url_signup, data_signup)

            console.log(result)
           
            if(result.status === 'ok'){
                
                if(result.data.step === "CODE_SENT"){
                     // mOSTRAMOS EL RESTO DEL FORM
                    document.querySelector(".signup_form .fa2").style = "display: block"
                    // oCULTAMOS LO ANTERIOR
                    // document.querySelector(".signup_form .top_data #btn_signup").style = "display:none"
                    btn_signup.parentNode.removeChild(btn_signup)
                    alert(result.data.message)   // Le hemos enviado un codigo por Email, ....
                    btn_verify_signup.addEventListener("click", async (ev)=>{
                        ev.preventDefault();
                        
                        // AÑADIMOS EL CODE
                        data_signup.promoCode = document.querySelector("#promoCodeWrap #promoCode").value
                        data_signup.code = document.querySelector(".signup_form .fa2 #signup_validation_token").value;
                        const result2 = await fetchRequest(url_signup, data_signup)
                        
                        if(result2.status === "ok"){
                            console.log(result2)
                            alert("Usuario Registrado CON EXITO")

                            window.location.replace(result2.data.location)

                        }else if(result2.code === 415){
                            alert(result2.data.message)
                        }else{

                            alert("Error: " + result2.data.message)

                        }
                    })

                }
            

            }else{
               alert("ERROR -1: " + result.data.message);
               // limpiamos el formulario [SOLO EL EMAIL]

            }
            
        })
        
        
        btn_login.addEventListener('click', async (ev)=>{
            ev.preventDefault();
            data_login.name = document.querySelector('.login_form .username').value;
            data_login.email = document.querySelector(".login_form .email").value;
            data_login.password = document.querySelector(".login_form .password").value;

            if(data_login.name.length <2){
                alert("Name is < than 2 chars")
                return;
            }

              // Añadimos el Endpoint que le llevo al signup para luego devolverle a el
            data_login.previous_endpoint = location.search.split("=")[1];
            console.log(data_login);

            ev.preventDefault();

            const result = await fetchRequest("http://localhost:3000/login-email.html", data_login)

            console.log(result)

            if(result.status === 'ok'){
                console.log(result.data)
                alert(result.data.message)
                // enviaremos al location recibido
                window.location.replace(result.data.location)

            }else if(result2.code === 415){
                alert(result.data.message)  

            }else{
               alert("ERROR LOGIN: " + result.data.message);
               // limpiamos el formulario [SOLO EL EMAIL]

            }
        })

        btn_forgot_password.addEventListener('click', async (ev)=>{
            ev.preventDefault();
            data_forgot_password.email = document.querySelector(" #forgot-password-content .password").value;

            console.log(data_forgot_password);
            const url = "http://localhost:3000/forgot-password.html"

            try{
                const result = await fetch(url,
                
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {  "Content-Type": "application/json",
                                "Cookie": document.cookie
                            },
                    body:  JSON.stringify(data_forgot_password)
                
                });

                const payload = await result.json()
            
                if(result.status >= 200 && result.status <300){

                    alert(payload.message)
                    if(payload.location){
                        window.location.replace(payload.location)
                    }
                    
                }else{ 
                    
                    alert(payload.message)
                    if(payload.location){
                        window.location.replace(payload.location)
                    }
                    
                }

            }catch(e){
                
                console.log(e)
                alert("Error en el Fetch -> redirigir a home")
                
            }
            
        })
        

        btn_logout.addEventListener('click',  async (ev)=>{

            ev.preventDefault();
            const url = "http://localhost:3000/logout.html"

            try{
                const result = await fetch(url,
                
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {  "Content-Type": "application/json",
                                "Cookie": document.cookie
                            },
                    body:  JSON.stringify({user:"lolo"})
                
                });

                const payload = await result.json()
            
                if(result.status >= 200 && result.status <300){

                    alert(payload.message)
                    if(payload.location){
                        window.location.replace(payload.location)
                    }
                    
                }else{ 
                    
                    alert(payload.message)
                    if(payload.location){
                        window.location.replace(payload.location)
                    }
                    
                }

            }catch(e){
                
                console.log(e)
                alert("Error en el Fetch -> redirigir a home")
                
            }
            
           

        })


        async function fetchRequest(url, data){
            
            try{
                const result = await fetch(url,
                
                {
                    method: 'POST',
                    credentials: 'include',
                    headers: {  "Content-Type": "application/json",
                                "Cookie": document.cookie
                            },
                    body:  JSON.stringify(data)
                
                });

                const payload = await result.json()
                console.log(result.status)
                console.log(payload.message)
                
               
                if(result.status >= 200 && result.status <300){

                    return {status: "ok", data: payload}
                }else if(result.status >= 300 && result.status <399){ 
                    return {status: "ok", data: payload}
                }else if(result.status >= 400 && result.status <500){ 

                    return {status: "error", data: payload}
                    
                }else if(result.status >= 500 && result.status <599){ 
                    return {status: "error", data: {code: 500, message: "Error en el Server. Prueba pasados unos minutos"}}
                }

            }catch(e){
                console.log("TRY 1 -> ERROR -> error en la peticion fetch")
                console.log(e)
                return null;
            }

        }

    </script>

    <script type="module">

    import { authFetch } from './statics/apiClient.js';

    // Tu Client ID obtenido en Google Cloud Console
    const GOOGLE_CLIENT_ID = "91494631029-fllv3la87i5h817febl31bsstfjqc277.apps.googleusercontent.com";

    // Callback ejecutado por Google tras la autorización
    async function handleGoogleCredentialResponse(googleResponse) {
        const statusBox = document.getElementById('authStatusMessage');
        statusBox.style.display = 'block';
        statusBox.textContent = 'Autenticando con Google...';

        try {
            // Enviamos el JWT firmado por Google a nuestro backend
            const res = await fetch('/google-oauth', {
                method: 'POST',
                //credentials: 'include', // Para recibir las cookies de sesión (atk, rtk)
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id_google_token: googleResponse.credential,
                    authProvider: "GOOGLE"
                })
            });

            const data = await res.json().catch(() => ({}));

            if (res.ok && data.status === 'ok') {
                statusBox.textContent = '¡Inicio de sesión correcto! Redirigiendo...';
                // Redirigir al panel del usuario o destino previsto
                console.log(data.location)
                aler("REdirigimos a: ", data.location)
                window.location.replace(data.location);
            } else {
                statusBox.textContent = data.message || 'Error al autenticar con Google.';
                console.error('Error auth Google:', data);
            }
        } catch (error) {
            statusBox.textContent = 'Error de conexión con el servidor.';
            console.error('Error de red:', error);
        }
    }

    // Inicializar Google Sign-In al cargar la ventana
    window.addEventListener('load', () => {
        if (window.google) {
            window.google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true
            });

            // Renderizar el botón en el contenedor
            window.google.accounts.id.renderButton(
                document.getElementById('googleBtnContainer'),
                { 
                    theme: 'outline', 
                    size: 'large', 
                    type: 'standard', 
                    shape: 'rectangular',
                    text: 'signin_with', 
                    logo_alignment: 'left',
                    width: 280 
                }
            );

            // Opcional: Mostrar selector One Tap si el usuario ya tiene sesión en Google
            // window.google.accounts.id.prompt();
        }
    });
</script>
