            const closeModal = function(type){
                responseType = null;
                modalContent.innerHTML = "";
                modal.close();
                modalOpenned = false;
                submiting = false;
                // Eliminamos los listeners
                modalContent.removeEventListener("click", manageModal, true)
                closeModalBtn.removeEventListener("click", this, true)
                
               

            }
            const showModal = function(response){

                if(modalOpenned || submiting){
                    alert("Esta abierto o  enviando")
                    return
                }else {
                    
                    modalContent.innerHTML = "";
                    modalTitle.textContent = response.type
                    modal.showModal();
                }
                
                modalOpenned = true;
                submiting = false;

                closeModalBtn.addEventListener("click", closeModal);
              
                const styles = document.createElement("style")
                styles.textContent = response.style;
                const script = document.createElement("script")
                script.textContent = response.script;
                // Insertamos Htm, Styles y Script
                modal.appendChild(styles);
                modal.appendChild(script)
                return;

            }

            const renderItems = function(response){
                let items = ""
                const data = response.data;
                let total = response.data.length;
                let html = response.html;
                const params = response.params;
                
                while(total--){
                    let len = params.length;
                    let item = ""
                    item = html

                    for(let i=0; i<len; i++){
                        // console.log(params[i])
                        // console.log(data[total][params[i]])
                        item = item.replaceAll("{{"+params[i]+"}}", data[total][params[i]])
                        // console.log(item)
                    }
                    items += item

                }
                modalContent.innerHTML = items;

            }

            const fetchRequest = async function(url, data){
                
                try{
                    const result = await fetch(url,
                        
                        {
                            method: 'POST',
                            credentials: 'include',
                            headers: {  "Content-Type": "application/json",
                                        "Cookie": document.cookie
                                    },
                            body:  JSON.stringify(data)
                        
                        });
                    
                    // Este status no lo seteamos nosotros directamente en el server. 
                    // 
                    if(result.status === 200){

                        try{

                            const data = await result.json()
                            return data;

                        }catch(e){
                            console.log("TRY 2 -> ERROR. INVALID JSON ??")
                            console.log(e)
                            return {status: "error", message: "ERROR. INVALID JSON ??"}
                        }
                    }else{ 

                        console.log("Error en la PETICION FETCH -> status != 200")
                        return {status: "error", message: "Error el la tramitacion de la petición"}
                        
                    }

                }catch(e){
                    console.log("TRY 1 -> ERROR -> error en la peticion fetch")
                    console.log(e)
                    return {status: "error", message: "Error el la tramitacion de la petición"}

                }
            }
